[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "min-os"
path = "src/main.rs"
test = false
bench = false

[dependencies]
linked_list_allocator = "0.10"
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = ["regular", "bold", "size_16", "size_20", "size_24", "size_32", "unicode-basic-latin", "unicode-latin-1-supplement", "unicode-specials"] }
smoltcp = { version = "0.14", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "socket-icmp", "socket-dhcpv4", "socket-dns"] }
embedded-tls = { version = "0.19", default-features = false, features = ["alloc"] }
embedded-io = "0.7"
rand_core = { version = "0.6", default-features = false }
sha2 = { version = "0.10", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "sha256"] }
