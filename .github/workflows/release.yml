# A ogni push su main: compila MIN-OS, prova l'avvio in QEMU (BIOS e UEFI),
# firma l'aggiornamento e lo pubblica come Release. MIN-OS lo trova da solo
# in Impostazioni > Aggiornamenti.
name: Build e aggiornamento

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup show

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: QEMU e OVMF (per la prova di avvio)
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf

      - name: Compila e firma
        env:
          MINOS_BUILD: ${{ github.run_number }}
          MINOS_SIGN_KEY: ${{ secrets.MINOS_SIGN_KEY }}
          MINOS_NOTES: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$MINOS_SIGN_KEY" ]; then
            echo "::error::Manca il secret MINOS_SIGN_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          cargo run --release -- release

      - name: Prova di avvio in QEMU
        run: bash tools/smoke-test.sh target/dist/min-os.img

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^version=' target/dist/latest.txt | cut -d= -f2)
          NOTES=$(git log -1 --pretty=%B)
          gh release create "build-${{ github.run_number }}" \
            target/dist/update.bin target/dist/latest.txt target/dist/min-os.img \
            --title "MIN-OS $VER" --notes "$NOTES" --latest
